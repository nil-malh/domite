name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: Generate Changelog (git-cliff)
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package archive & checksums (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="domite-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${PKG}/completions"
          cp "target/${{ matrix.target }}/release/domite" "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          if "dist/${PKG}/domite" --version >/dev/null 2>&1; then
            "dist/${PKG}/domite" --completions bash > "dist/${PKG}/completions/domite.bash"
            "dist/${PKG}/domite" --completions zsh > "dist/${PKG}/completions/_domite"
            "dist/${PKG}/domite" --completions fish > "dist/${PKG}/completions/domite.fish"
          fi
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          cd dist
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Package archive & checksums (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Tag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $Pkg = "domite-$Tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$Pkg/completions" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/domite.exe" "dist/$Pkg/"
          Copy-Item README.md LICENSE "dist/$Pkg/"
          & "dist/$Pkg/domite.exe" --completions powershell > "dist/$Pkg/completions/_domite.ps1"
          Compress-Archive -Path "dist/$Pkg" -DestinationPath "dist/$Pkg.zip"
          $Hash = (Get-FileHash "dist/$Pkg.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Pkg.zip" | Out-File -Encoding ascii "dist/$Pkg.zip.sha256"

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  github-release:
    name: Publish GitHub Release
    needs: [changelog, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate release assets & SHA256SUMS
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.sha256" -exec cat {} + > release-assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "domite ${{ github.event.inputs.tag || github.ref_name }}"
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-crate:
    name: Publish to crates.io
    needs: [github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set; skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked
