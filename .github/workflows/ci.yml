name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --locked

      - name: Run headless smoke checks (--demo --check, --snapshot, --completions)
        run: |
          cargo run --locked -- --demo --check
          cargo run --locked -- --demo --snapshot
          cargo run --locked -- --demo connectors --snapshot
          cargo run --locked -- --demo schemas --snapshot
          cargo run --locked -- --demo cg --snapshot
          cargo run --locked -- --demo quotas --snapshot
          cargo run --locked -- --completions bash > /dev/null

      - name: Verify crate packaging (dry-run)
        if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run --allow-dirty
