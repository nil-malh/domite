[package]
name = "domite"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A terminal UI for ns4kafka, built the sofka way"
repository = "https://github.com/nil-malh/domite"
readme = "README.md"
keywords = ["kafka", "ns4kafka", "kafkactl", "tui", "ratatui"]
categories = ["command-line-utilities"]
exclude = [".github/", "cliff.toml"]

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
futures-util = "0.3"
memchr = "2.7"
nucleo-matcher = "0.3"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
similar = "2.7"
terminal-colorsaurus = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
unicode-segmentation = "1.12"
unicode-width = "0.2"
urlencoding = "2.1"

[profile.release]
lto = "thin"
strip = true

